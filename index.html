<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantenkennis</title>
<style>
:root{
  --bg:#f3efe4; --paper:#fffdf7; --ink:#1d2a21; --muted:#5d6a60; --line:#d9d3c2;
  --green:#2c5a3a; --green-d:#1f4229; --leaf:#dfe9d6; --ok:#2b7a4b; --ok-bg:#dff1e3;
  --bad:#b23b2a; --bad-bg:#f8e0da; --gold:#b9852f; --r:14px;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
.lat{font-style:italic}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

header.top{background:var(--green-d);color:#f5f1e4;position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--serif);font-size:1.3rem;letter-spacing:.01em;margin-right:auto;display:flex;align-items:center;gap:9px}
.brand svg{width:24px;height:24px}
nav.tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:none;color:inherit;padding:6px 16px;border-radius:999px}
nav.tabs button[aria-current=true]{background:#f5f1e4;color:var(--green-d);font-weight:600}
.bar{background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 14px}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0}
.switch i{width:38px;height:22px;border-radius:999px;background:#c5c0b0;position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{left:19px}
.switch input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem}

main{padding:26px 0 60px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel+.panel{margin-top:16px}
.step{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.step b{font-family:var(--serif);color:var(--gold);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;display:inline-flex;gap:8px;align-items:center}
.chip small{color:var(--muted)}
.chip[aria-pressed=true]{background:var(--leaf);border-color:var(--green);font-weight:600}
.chip.wild{border-style:dashed}
.linkbtn{border:0;background:none;color:var(--green);text-decoration:underline;padding:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.mode:hover:not(:disabled){border-color:var(--green);background:var(--leaf)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode strong{font-family:var(--serif);font-size:1.1rem}
.mode span{color:var(--muted);font-size:.92rem}
.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:999px;padding:9px 20px;font-weight:600}
.btn.ghost{background:none;color:var(--green)}
.btn:disabled{opacity:.5}
.btn.snd{display:inline-flex;align-items:center;gap:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.prog i{display:block;height:100%;background:var(--green);transition:width .2s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.92rem}
.quiz{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.quiz{grid-template-columns:1fr}}
.photo{position:relative;background:#e6e1d2;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo .tag{position:absolute;left:10px;bottom:10px;background:rgba(20,30,22,.75);color:#fff;font-size:.82rem;padding:3px 10px;border-radius:99px}
.photo .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:1.2rem;line-height:1}
.photo .nav.prev{left:8px}.photo .nav.next{right:8px}
.photo .count{position:absolute;right:10px;bottom:10px;background:rgba(20,30,22,.75);color:#fff;font-size:.8rem;padding:3px 9px;border-radius:99px}
.nofoto{color:var(--muted);font-size:.9rem;padding:12px;text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:1.05rem;min-height:54px}
.opt kbd{font:600 .8rem var(--sans);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--bg)}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.ask{font-family:var(--serif);font-size:1.7rem;margin:4px 0 4px}
.ask small{display:block;font:400 .95rem var(--sans);color:var(--muted);margin-bottom:6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pick{position:relative;border:3px solid transparent;border-radius:var(--r);overflow:hidden;padding:0;background:#e6e1d2;aspect-ratio:4/3}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick kbd{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border-radius:6px;padding:1px 8px;font:600 .8rem var(--sans)}
.pick:hover:not(:disabled){border-color:var(--green)}
.pick.ok{border-color:var(--ok)}.pick.bad{border-color:var(--bad)}
.pick.dim{opacity:.55}
.pick .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,30,22,.8);color:#fff;font-size:.85rem;padding:5px 8px;text-align:left}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:#fff}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb h3{font-size:1.05rem;margin-bottom:4px}
.names .p1{font-family:var(--serif);font-size:1.3rem}
.names .p2{color:var(--muted)}
.names .fam{font-size:.9rem;color:var(--muted)}

.card{perspective:1400px;max-width:620px;margin:0 auto}
.card .inner{position:relative;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 22px rgba(30,40,30,.08)}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding:26px}
.face.back .p1{font-size:1.9rem}
@media(prefers-reduced-motion:reduce){.card .inner{transition:none}}
.cardbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn.again{background:#fff;color:var(--bad);border-color:var(--bad)}

.score{font-family:var(--serif);font-size:3rem;color:var(--green)}
.list{display:grid;gap:8px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;text-align:left;width:100%}
.item img,.item .ph{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#e6e1d2;flex:none}

.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:700px){.filters{grid-template-columns:1fr}}
.filters input,.filters select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:18px}
.pc{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.pc:hover{border-color:var(--green)}
.pc .im{aspect-ratio:4/3;background:#e6e1d2;display:grid;place-items:center}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc .tx{padding:10px 12px 12px}
.pc .p1{font-family:var(--serif);font-size:1.02rem;line-height:1.25}
.pc .p2{color:var(--muted);font-size:.88rem}

dialog{border:0;border-radius:18px;padding:0;width:min(920px,94vw);max-height:92vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,22,.55)}
.dlg{padding:22px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media(max-width:760px){.dlg{grid-template-columns:1fr}}
dialog .close{position:absolute;right:12px;top:10px;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:1.2rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;width:62px;height:48px;background:#e6e1d2}
.thumbs button[aria-current=true]{border-color:var(--green)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
dl.facts{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dl.facts dt{color:var(--muted);font-size:.9rem}
dl.facts dd{margin:0}
.note{font-size:.85rem;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19c3-5 6-8 10-10"/></svg>Plantenkennis</div>
  <nav class="tabs" aria-label="Onderdelen">
    <button data-tab="leren">Leren</button>
    <button data-tab="bank">Plantenbank</button>
  </nav>
</div></header>
<div class="bar"><div class="wrap">
  <div class="seg" role="group" aria-label="Niveau">
    <button data-lvl="34">Niveau 3/4</button>
    <button data-lvl="12">Niveau 1/2</button>
  </div>
  <label class="switch"><input type="checkbox" id="fam"><i></i><span>Familienaam tonen</span></label>
  <span class="hint" id="lvlhint"></span>
</div></div>
<main><div class="wrap" id="app"></div></main>
<dialog id="dlg" aria-label="Plantinformatie"></dialog>

<script src="data/instellingen.js"></script>
<script src="data/planten.js"></script>
<script>
(function(){
'use strict';
var CFG = window.INSTELLINGEN || {};
var BASE = CFG.fotoBasis || 'fotos/';
var AUD = CFG.audioBasis || 'audio/';
var ALL = window.PLANTEN || [];
var byId = {}; ALL.forEach(function(p){ byId[p.id] = p; });

/* ---------- opslag (per browser, mag mislukken) ---------- */
function load(k, d){ try{ var v = localStorage.getItem('pk_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} }
function save(k, v){ try{ localStorage.setItem('pk_'+k, JSON.stringify(v)); }catch(e){} }

var S = { tab:'leren', lvl: load('lvl','34'), fam: load('fam', false), per: load('per', {}), n: load('n', 20), run:null,
          bank:{q:'', cat:'', per:''} };

/* ---------- hulpjes ---------- */
var app = document.getElementById('app'), dlg = document.getElementById('dlg');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function img(p, i, small){ return BASE + p.id + '/' + p.p[i][0] + (small?'_k':'') + '.webp'; }
function pers(p, lvl){ return (lvl==='34'? p.a : p.b) || []; }
function pool(lvl){ return ALL.filter(function(p){ return pers(p,lvl).length; }); }
function perLabel(x){ return x==='W' ? 'Wilde flora' : 'Periode '+x; }
function allPers(lvl){
  var set={}; pool(lvl).forEach(function(p){ pers(p,lvl).forEach(function(x){ set[x]=(set[x]||0)+1; }); });
  var keys=Object.keys(set).filter(function(k){return k!=='W';}).map(Number).sort(function(a,b){return a-b;});
  if(set.W) keys.push('W');
  return keys.map(function(k){ return {k:k, n:set[k]}; });
}
function prim(p){ return S.lvl==='34' ? p.l : p.n; }
function sec(p){ return S.lvl==='34' ? p.n : p.l; }
function nm(text, isLat){ return '<span'+(isLat?' class="lat"':'')+'>'+esc(text)+'</span>'; }
function namesHTML(p, withFam){
  var latFirst = S.lvl==='34';
  return '<div class="names"><div class="p1">'+nm(prim(p),latFirst)+'</div><div class="p2">'+nm(sec(p),!latFirst)+'</div>'+
    (withFam && p.f ? '<div class="fam">Familie: <span class="lat">'+esc(p.f)+'</span></div>' : '')+'</div>';
}
function imgTag(src, alt){ return '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'nofoto\',textContent:\'Foto niet gevonden\'}))">'; }

/* ---------- uitspraak ---------- */
var player = null;
function sndBtn(p){ return p.u ? '<button class="btn ghost snd" data-snd="'+p.id+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Uitspraak</button>' : ''; }
document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('[data-snd]'); if(!b) return;
  e.stopPropagation();
  if(player) player.pause();
  player=new Audio(AUD+b.dataset.snd+'.m4a');
  player.play().catch(function(){ b.textContent='Geluid niet beschikbaar'; });
});

/* ---------- vaste balk ---------- */
function chrome(){
  document.querySelectorAll('[data-tab]').forEach(function(b){ b.setAttribute('aria-current', b.dataset.tab===S.tab); });
  document.querySelectorAll('[data-lvl]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lvl===S.lvl); });
  document.getElementById('fam').checked = !!S.fam;
  document.getElementById('lvlhint').textContent = S.lvl==='34' ? 'Latijnse naam staat voorop' : 'Nederlandse naam staat voorop';
}
document.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick=function(){ S.tab=b.dataset.tab; S.run=null; render(); }; });
document.querySelectorAll('[data-lvl]').forEach(function(b){ b.onclick=function(){
  if(S.run && !confirmLeave()) return;
  S.lvl=b.dataset.lvl; save('lvl',S.lvl); S.run=null; render(); }; });
document.getElementById('fam').onchange=function(e){ S.fam=e.target.checked; save('fam',S.fam); render(true); };
function confirmLeave(){ return true; }

function render(keep){
  chrome();
  if(S.tab==='bank') return viewBank();
  if(!S.run) return viewStart();
  if(S.run.done) return viewEnd();
  if(S.run.mode==='kaart') return viewCard(keep);
  return viewQuiz(keep);
}

/* ---------- start: perioden en leermodus ---------- */
function selPers(){ var all=allPers(S.lvl).map(function(x){return String(x.k);}); return (S.per[S.lvl]||[]).filter(function(k){return all.indexOf(k)>=0;}); }
function selection(){
  var sel=selPers();
  return pool(S.lvl).filter(function(p){ return p.p.length && pers(p,S.lvl).some(function(x){ return sel.indexOf(String(x))>=0; }); });
}
function viewStart(){
  var ps=allPers(S.lvl), sel=selPers(), cnt=selection().length;
  var h='<div class="panel"><div class="step"><b>1</b><h2>Kies je perioden</h2></div><div class="chips">';
  ps.forEach(function(x){
    h+='<button class="chip'+(x.k==='W'?' wild':'')+'" data-per="'+x.k+'" aria-pressed="'+(sel.indexOf(String(x.k))>=0)+'">'+perLabel(x.k)+' <small>'+x.n+'</small></button>';
  });
  h+='</div><div class="row" style="margin-top:10px"><button class="linkbtn" id="all">Alles kiezen</button><button class="linkbtn" id="none">Niets kiezen</button>'+
     '<span class="hint">'+(cnt? cnt+' planten met foto gekozen' : 'Kies minstens één periode')+'</span></div></div>';
  h+='<div class="panel"><div class="step"><b>2</b><h2>Aantal vragen</h2></div><div class="seg" role="group" aria-label="Aantal">';
  [10,20,40,0].forEach(function(n){ h+='<button data-n="'+n+'" aria-pressed="'+(S.n===n)+'">'+(n||'Alles')+'</button>'; });
  h+='</div></div>';
  var dis = cnt<2 ? ' disabled' : '';
  h+='<div class="panel"><div class="step"><b>3</b><h2>Kies een leermodus</h2></div><div class="modes">'+
     '<button class="mode" data-mode="fn"'+dis+'><strong>Foto → naam</strong><span>Je ziet een foto en kiest uit vier namen.</span></button>'+
     '<button class="mode" data-mode="nf"'+dis+'><strong>Naam → foto</strong><span>Je ziet een naam en kiest uit vier foto\'s.</span></button>'+
     '<button class="mode" data-mode="kaart"'+dis+'><strong>Flitskaarten</strong><span>Foto op de voorkant, namen op de achterkant.</span></button>'+
     '</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-per]').forEach(function(b){ b.onclick=function(){
    var k=b.dataset.per, s=selPers(), i=s.indexOf(k); if(i>=0) s.splice(i,1); else s.push(k);
    S.per[S.lvl]=s; save('per',S.per); viewStart(); }; });
  document.getElementById('all').onclick=function(){ S.per[S.lvl]=ps.map(function(x){return String(x.k);}); save('per',S.per); viewStart(); };
  document.getElementById('none').onclick=function(){ S.per[S.lvl]=[]; save('per',S.per); viewStart(); };
  app.querySelectorAll('[data-n]').forEach(function(b){ b.onclick=function(){ S.n=+b.dataset.n; save('n',S.n); viewStart(); }; });
  app.querySelectorAll('[data-mode]').forEach(function(b){ b.onclick=function(){ startRun(b.dataset.mode, selection()); }; });
}
function startRun(mode, plants){
  var q=shuffle(plants); if(S.n && q.length>S.n) q=q.slice(0,S.n);
  S.run={mode:mode, queue:q, total:q.length, i:0, good:0, wrong:[], known:0, cur:null, done:false, src:plants};
  next();
}

/* ---------- meerkeuze ---------- */
function distractors(t){
  var cands=pool(S.lvl).filter(function(p){ return p.id!==t.id && p.p.length && prim(p).toLowerCase()!==prim(t).toLowerCase(); });
  var same=shuffle(cands.filter(function(p){return p.c===t.c;})), rest=shuffle(cands.filter(function(p){return p.c!==t.c;}));
  var out=[], seen={};
  same.concat(rest).forEach(function(p){ var k=prim(p).toLowerCase(); if(out.length<3 && !seen[k]){ seen[k]=1; out.push(p); } });
  return out;
}
function next(){
  var r=S.run;
  if(r.i>=r.queue.length){ r.done=true; return render(); }
  var t=r.queue[r.i];
  if(r.mode==='kaart'){ r.cur={t:t, ph:Math.floor(Math.random()*t.p.length), flip:false}; }
  else{
    var opts=shuffle([t].concat(distractors(t)));
    r.cur={t:t, opts:opts, ph:Math.floor(Math.random()*t.p.length), phs:opts.map(function(o){return Math.floor(Math.random()*o.p.length);}), ans:null};
  }
  render();
}
function head(){
  var r=S.run, pct=Math.round(100*r.i/r.queue.length);
  return '<div class="qhead"><span>'+(r.mode==='kaart'?'Kaart ':'Vraag ')+(r.i+1)+' van '+r.queue.length+'</span>'+
         '<button class="linkbtn" id="stop">Stoppen</button></div><div class="prog"><i style="width:'+pct+'%"></i></div>';
}
function photoBox(p, i, opts){
  opts=opts||{};
  var many=p.p.length>1;
  return '<div class="photo">'+imgTag(img(p,i), opts.alt||'Foto van de plant')+
    (p.p[i][1] ? '<span class="tag">'+esc(p.p[i][1])+'</span>' : '')+
    (many ? '<button class="nav prev" data-ph="-1" aria-label="Vorige foto">‹</button><button class="nav next" data-ph="1" aria-label="Volgende foto">›</button><span class="count">'+(i+1)+' / '+p.p.length+'</span>' : '')+'</div>';
}
function viewQuiz(){
  var r=S.run, c=r.cur, t=c.t, latFirst=S.lvl==='34', done=c.ans!==null, h=head();
  if(r.mode==='fn'){
    h+='<div class="quiz"><div>'+photoBox(t,c.ph)+'</div><div><div class="ask"><small>Welke plant is dit?</small></div><div class="opts">';
    c.opts.forEach(function(o,i){
      var cls=''; if(done){ if(o.id===t.id) cls=' ok'; else if(i===c.ans) cls=' bad'; }
      h+='<button class="opt'+cls+'" data-o="'+i+'"'+(done?' disabled':'')+'><kbd>'+(i+1)+'</kbd>'+nm(prim(o),latFirst)+'</button>';
    });
    h+='</div>'+feedback()+'</div></div>';
  }else{
    h+='<div class="ask"><small>Welke foto hoort bij deze plant?</small>'+nm(prim(t),latFirst)+'</div><div class="grid4">';
    c.opts.forEach(function(o,i){
      var cls=''; if(done){ cls = o.id===t.id ? ' ok' : (i===c.ans ? ' bad' : ' dim'); }
      h+='<button class="pick'+cls+'" data-o="'+i+'"'+(done?' disabled':'')+' aria-label="Foto '+(i+1)+'">'+imgTag(img(o,c.phs[i]),'Foto '+(i+1))+'<kbd>'+(i+1)+'</kbd>'+
         (done?'<span class="cap">'+nm(prim(o),latFirst)+'</span>':'')+'</button>';
    });
    h+='</div>'+feedback();
  }
  app.innerHTML=h;
  document.getElementById('stop').onclick=function(){ S.run=null; render(); };
  app.querySelectorAll('[data-o]').forEach(function(b){ b.onclick=function(){ answer(+b.dataset.o); }; });
  app.querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ c.ph=(c.ph+ +b.dataset.ph+t.p.length)%t.p.length; viewQuiz(); }; });
  var nx=document.getElementById('next'); if(nx){ nx.onclick=function(){ r.i++; next(); }; nx.focus(); }
  var inf=document.getElementById('info'); if(inf) inf.onclick=function(){ openPlant(t.id); };
}
function feedback(){
  var c=S.run.cur; if(c.ans===null) return '';
  var ok=c.opts[c.ans].id===c.t.id;
  return '<div class="fb '+(ok?'ok':'bad')+'" role="status"><h3>'+(ok?'Goed!':'Helaas, het juiste antwoord is:')+'</h3>'+namesHTML(c.t,S.fam)+
    '<div class="row" style="margin-top:12px"><button class="btn" id="next">'+(S.run.i+1>=S.run.queue.length?'Bekijk resultaat':'Volgende')+'</button>'+
    sndBtn(c.t)+'<button class="btn ghost" id="info">Bekijk in plantenbank</button></div></div>';
}
function answer(i){
  var r=S.run, c=r.cur; if(c.ans!==null) return;
  c.ans=i; if(c.opts[i].id===c.t.id) r.good++; else r.wrong.push(c.t);
  viewQuiz();
}

/* ---------- flitskaarten ---------- */
function viewCard(){
  var r=S.run, c=r.cur, t=c.t;
  var h=head()+'<div class="card'+(c.flip?' flip':'')+'" id="card"><div class="inner">'+
    '<div class="face front">'+photoBox(t,c.ph)+'</div>'+
    '<div class="face back">'+namesHTML(t,S.fam)+'<div class="hint">'+esc(t.c||'')+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:10px">'+sndBtn(t)+'<button class="btn ghost" id="info">Bekijk in plantenbank</button></div></div></div></div>'+
    '<div class="cardbtns">'+(c.flip
      ? '<button class="btn again" id="again">Nog oefenen</button><button class="btn" id="known">Ken ik</button><button class="btn ghost" id="flip">Terug naar foto</button>'
      : '<button class="btn" id="flip">Draai om</button>')+'</div>'+
    '<p class="hint" style="text-align:center">Spatiebalk draait de kaart. Pijltjes bladeren door de foto\'s.</p>';
  app.innerHTML=h;
  document.getElementById('stop').onclick=function(){ S.run=null; render(); };
  document.getElementById('flip').onclick=function(){ c.flip=!c.flip; viewCard(); };
  app.querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); c.ph=(c.ph+ +b.dataset.ph+t.p.length)%t.p.length; viewCard(); }; });
  var a=document.getElementById('again'), k=document.getElementById('known'), inf=document.getElementById('info');
  if(a) a.onclick=function(){ r.queue.push(t); if(r.wrong.indexOf(t)<0) r.wrong.push(t); r.i++; next(); };
  if(k) k.onclick=function(){ r.known++; r.i++; next(); };
  if(inf) inf.onclick=function(){ openPlant(t.id); };
}

/* ---------- eindscherm ---------- */
function viewEnd(){
  var r=S.run, h='<div class="panel" style="text-align:center">';
  if(r.mode==='kaart') h+='<h2>Stapel klaar</h2><div class="score">'+r.total+'</div><p>kaarten geoefend'+(r.wrong.length?' — '+r.wrong.length+' daarvan had je nog een keer nodig':'')+'</p>';
  else h+='<h2>Resultaat</h2><div class="score">'+r.good+' / '+r.total+'</div><p>'+(r.good===r.total?'Alles goed. Knap gedaan!':'Bekijk hieronder welke planten je nog kunt oefenen.')+'</p>';
  h+='<div class="row" style="justify-content:center">'+(r.wrong.length>1?'<button class="btn" id="redo">Fouten opnieuw oefenen</button>':'')+
     '<button class="btn ghost" id="again2">Nog een ronde</button><button class="btn ghost" id="back">Andere keuze</button></div></div>';
  if(r.wrong.length){
    h+='<div class="panel"><h3>Nog oefenen</h3><div class="list">';
    r.wrong.forEach(function(p){ h+='<button class="item" data-id="'+p.id+'">'+imgTag(img(p,0,true),'')+namesHTML(p,S.fam)+'</button>'; });
    h+='</div></div>';
  }
  app.innerHTML=h;
  var redo=document.getElementById('redo'); if(redo) redo.onclick=function(){ var n=S.n; S.n=0; startRun(r.mode, r.wrong.slice()); S.n=n; };
  document.getElementById('again2').onclick=function(){ startRun(r.mode, r.src); };
  document.getElementById('back').onclick=function(){ S.run=null; render(); };
  app.querySelectorAll('[data-id]').forEach(function(b){ b.onclick=function(){ openPlant(b.dataset.id); }; });
}

/* ---------- plantenbank ---------- */
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function viewBank(){
  var B=S.bank, cats={}; ALL.forEach(function(p){ if(p.c) cats[p.c]=1; });
  var h='<div class="panel"><h2 style="margin-bottom:12px">Plantenbank</h2><div class="filters">'+
    '<input id="q" type="search" placeholder="Zoek op Latijnse naam, Nederlandse naam of familie" value="'+esc(B.q)+'" aria-label="Zoeken">'+
    '<select id="cat" aria-label="Plantgroep"><option value="">Alle plantgroepen</option>'+Object.keys(cats).sort().map(function(c){return '<option'+(B.cat===c?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select>'+
    '<select id="per" aria-label="Periode"><option value="">Alle perioden ('+(S.lvl==='34'?'niveau 3/4':'niveau 1/2')+')</option>'+allPers(S.lvl).map(function(x){return '<option value="'+x.k+'"'+(B.per===String(x.k)?' selected':'')+'>'+perLabel(x.k)+'</option>';}).join('')+'</select>'+
    '</div><p class="hint" id="cnt" style="margin:10px 0 0"></p></div><div class="cards" id="cards"></div>';
  app.innerHTML=h;
  function list(){
    var q=norm(B.q), latFirst=S.lvl==='34';
    var res=ALL.filter(function(p){
      if(B.cat && p.c!==B.cat) return false;
      if(B.per && pers(p,S.lvl).map(String).indexOf(B.per)<0) return false;
      if(q && norm(p.l+' '+p.n+' '+(p.f||'')).indexOf(q)<0) return false;
      return true;
    }).sort(function(a,b){ return prim(a).localeCompare(prim(b),'nl'); });
    document.getElementById('cnt').textContent=res.length+' planten';
    document.getElementById('cards').innerHTML = res.length ? res.map(function(p){
      return '<button class="pc" data-id="'+p.id+'"><div class="im">'+(p.p.length?imgTag(img(p,0,true),''):'<span class="nofoto">Nog geen foto</span>')+'</div>'+
        '<div class="tx"><div class="p1">'+nm(prim(p),latFirst)+'</div><div class="p2">'+nm(sec(p),!latFirst)+'</div>'+
        (S.fam&&p.f?'<div class="p2 lat">'+esc(p.f)+'</div>':'')+'</div></button>';
    }).join('') : '<p class="empty">Geen planten gevonden.</p>';
    document.querySelectorAll('#cards [data-id]').forEach(function(b){ b.onclick=function(){ openPlant(b.dataset.id); }; });
  }
  document.getElementById('q').oninput=function(e){ B.q=e.target.value; list(); };
  document.getElementById('cat').onchange=function(e){ B.cat=e.target.value; list(); };
  document.getElementById('per').onchange=function(e){ B.per=e.target.value; list(); };
  list();
}
function openPlant(id, ph){
  var p=byId[id]; if(!p) return; ph=ph||0;
  var latFirst=S.lvl==='34';
  function perTxt(arr){ return arr&&arr.length ? arr.map(perLabel).join(', ') : '—'; }
  var h='<button class="close" aria-label="Sluiten">×</button><div class="dlg"><div>'+
    (p.p.length ? photoBox(p,ph,{alt:p.l})+'<div class="thumbs">'+p.p.map(function(f,i){
      return '<button data-t="'+i+'" aria-current="'+(i===ph)+'" title="'+esc(f[1])+'">'+imgTag(img(p,i,true),f[1])+'</button>'; }).join('')+'</div>'
      : '<div class="photo"><span class="nofoto">Van deze plant is nog geen foto beschikbaar.</span></div>')+
    '</div><div><div class="names"><h2 class="p1" style="font-size:1.6rem">'+nm(prim(p),latFirst)+'</h2><div class="p2" style="font-size:1.1rem">'+nm(sec(p),!latFirst)+'</div></div>'+
    (p.u?'<div style="margin-top:12px">'+sndBtn(p)+'</div>':'')+'<dl class="facts">'+
    '<dt>Familie</dt><dd class="lat">'+esc(p.f||'—')+'</dd>'+
    '<dt>Plantgroep</dt><dd>'+esc(p.c||'—')+'</dd>'+
    '<dt>Standplaats</dt><dd>'+esc(p.s||'Nog niet ingevuld')+'</dd>'+
    '<dt>Toepassing</dt><dd>'+esc(p.t||'Nog niet ingevuld')+'</dd>'+
    (p.k?'<dt>Kenmerken</dt><dd>'+esc(p.k)+'</dd>':'')+
    '<dt>Niveau 3/4</dt><dd>'+perTxt(p.a)+'</dd>'+
    '<dt>Niveau 1/2</dt><dd>'+perTxt(p.b)+'</dd></dl>'+
    (p.x?'<p class="note">Let op: de foto\'s tonen '+esc(p.x)+', niet exact deze soort of cultivar.</p>':'')+
    '</div></div>';
  dlg.innerHTML=h;
  dlg.querySelector('.close').onclick=function(){ dlg.close(); };
  dlg.querySelectorAll('[data-t]').forEach(function(b){ b.onclick=function(){ openPlant(id,+b.dataset.t); }; });
  dlg.querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ openPlant(id,(ph+ +b.dataset.ph+p.p.length)%p.p.length); }; });
  if(!dlg.open) dlg.showModal();
}
dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });

/* ---------- toetsenbord ---------- */
document.addEventListener('keydown',function(e){
  if(dlg.open || S.tab!=='leren' || !S.run || S.run.done) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  var r=S.run, c=r.cur;
  if(r.mode==='kaart'){
    if(e.key===' '){ e.preventDefault(); c.flip=!c.flip; viewCard(); }
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ var n=c.t.p.length; c.ph=(c.ph+(e.key==='ArrowRight'?1:-1)+n)%n; viewCard(); }
  }else if(c.ans===null && /^[1-4]$/.test(e.key) && +e.key<=c.opts.length){ answer(+e.key-1); }
});

if(!ALL.length){ app.innerHTML='<p class="empty">De plantenlijst (data/planten.js) is niet gevonden.</p>'; chrome(); }
else render();
})();
</script>
</body>
</html>
